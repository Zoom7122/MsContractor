services:
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:${POSTGRES_PORT:-5432}"

  redis:
    ports:
      - "${REDIS_HOST_PORT:-6379}:${REDIS_PORT:-6379}"

  redis-insight:
    ports:
      - "${REDIS_INSIGHT_PORT:-5540}:5540"

  kafka:
    ports:
      - "${KAFKA_HOST_PORT:-29092}:${KAFKA_PORT}"

  moysklad-egress-service:
    ports:
      - "${MOYSKLAD_EGRESS_SERVICE_PORT}:${SERVICE_INTERNAL_PORT}"

  catalog-sync-service:
    ports:
      - "${CATALOG_SYNC_SERVICE_PORT}:${SERVICE_INTERNAL_PORT}"

  duplicates-merge-service:
    ports:
      - "${DUPLICATES_MERGE_SERVICE_PORT}:${SERVICE_INTERNAL_PORT}"
